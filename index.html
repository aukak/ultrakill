<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ULTRAKILL</title>
    <link rel="icon" type="image/x-icon" href="ico.ico">
    <link rel="shortcut icon" type="image/x-icon" href="ico.ico">
    <link rel="stylesheet" href="style.css">
  </head>
    <script async src="https://googletagmanager.com"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
        gtag('config', 'G-1P8JW00CJG');
    </script>
  <body>
    <div id="indev-screen">
      <div class="card">
        <img src="logo.png" class="logo" alt="ULTRAKILL">
        <div class="badge">in-dev</div>
        <p>this is a webport of the game ultrakill, this is the ultrarevamp update. shaders and some features WILL be bugged; im working to fix that. please be patient as this WILL be updated regularly.</p>
        <a href="https://discord.gg/gRtkD9BMKA" target="_blank" rel="noopener noreferrer" class="btn">report bugs on discord</a>
        <br>
        <button id="start-btn" class="btn" type="button">start game</button>
      </div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="lock-hint">click to lock mouse</div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var hint = document.querySelector("#lock-hint");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita",
        productName: "ULTRAKILL",
        productVersion: "4.1",
        matchWebGLToCanvasSize: false,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: 1,
        cacheControl: function(url) {
          if (/\.unityweb|\.bundle|\.wasm/i.test(url)) return "immutable";
          return "no-store";
        }
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      canvas.requestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.webkitRequestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.addEventListener("dblclick", function(e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      function lockMouse() {
        if (document.pointerLockElement === canvas) return;
        canvas.focus();
        try {
          var p = canvas.requestPointerLock({
            unadjustedMovement: true
          });
          if (p && p.catch) p.catch(function() {
            canvas.requestPointerLock();
          });
        } catch (err) {
          try {
            canvas.requestPointerLock();
          } catch (e) {}
        }
      }
      canvas.addEventListener("click", lockMouse);
      canvas.addEventListener("mousedown", lockMouse);
      document.addEventListener("pointerlockchange", function() {
        hint.style.display = document.pointerLockElement === canvas ? "none" : "block";
      });
      document.addEventListener("pointerlockerror", function() {
        hint.style.display = "block";
      });
      canvas.addEventListener("contextmenu", function(e) {
        e.preventDefault();
      }, true);
      var booted = false;
      var started = false;
      function startGame() {
        started = true;
        document.getElementById("indev-screen").style.display = "none";
        container.style.visibility = "visible";
        loadUnityGame();
      }
      document.getElementById("start-btn").addEventListener("click", startGame);
      window.addEventListener("beforeunload", function(e) {
        if (!started) return;
        e.preventDefault();
        e.returnValue = "";
        return "";
      });
      function loadUnityGame() {
        if (booted) return;
        booted = true;
        loadingBar.style.display = "block";
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            hint.style.display = "block";
            unityInstance.SetFullscreen = function() {
              return 0;
            };
          }).catch(function(message) {
            var m = loadingBar.querySelector("p");
            if (!m) {
              m = document.createElement("p");
              loadingBar.appendChild(m);
            }
            m.textContent = message;
          });
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
